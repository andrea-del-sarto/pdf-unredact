[project]
name = "pdf-unredact"
version = "1.5.0"
description = "Local PDF redaction auditing and recovery tool with native font and layout preservation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf==1.26.7",
]

[project.scripts]
pdf-unredact = "pdf_unredact:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["pdf_unredact.py", "pdf_worker.py", "worker_client.py", "engine_api.py", "web_app.py", "i18n.py", "version.py", "locales/*.json", "static/*"]
