[project]
name = "pdf-unredact"
version = "1.1.1"
description = "Local PDF redaction auditing and recovery tool with native font and layout preservation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.0",
    "pymupdf>=1.26.0",
]

[project.scripts]
pdf-unredact = "pdf_unredact:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["pdf_unredact.py", "web_app.py", "i18n.py", "locales/*.json"]
